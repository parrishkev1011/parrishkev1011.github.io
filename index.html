<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapCut Template Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>CapCut Template Dashboard</h1>
        <div class="status-banner" id="statusBanner">
            <span class="status-indicator">🟢</span>
            <span>Site Status: <strong id="siteStatus">Live</strong></span>
            <span class="last-updated">Last Updated: <span id="lastUpdated"></span></span>
        </div>
    </header>
    <main>
        <section id="templates">
            <h2>Available Templates</h2>
            <div class="template-card">
                <h3>Template 1</h3>
                <p>Description of Template 1.</p>
                <button>Use Template</button>
            </div>
            <div class="template-card">
                <h3>Template 2</h3>
                <p>Description of Template 2.</p>
                <button>Use Template</button>
            </div>
            <!-- Add more templates as needed -->
        </section>
    </main>
    <footer>
        <p>&copy; 2026 CapCut Dashboard</p>
        <p class="deployment-info">Deployed via GitHub Pages | <a href="https://github.com/parrishkev1011/parrishkev1011.github.io" target="_blank">View Source</a></p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
